<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido · PCForge</title>
<link rel="stylesheet" href="style.css">
<script src="js/app.js"></script>
</head>
<body>
<div id="cab"></div>
<main>
<h1 id="t">Pedido</h1>
<div class="panel" id="d"></div>
<p><a href="pedidos.html">← Mis pedidos</a></p>
<script>
var id = parseInt(param("id"), 10);
function pintar(o) {
  document.getElementById("t").textContent = "Pedido #" + o.id;
  document.getElementById("d").innerHTML = '<p><strong>Componente:</strong> ' + o.producto + ' × ' + o.cantidad + '</p>' +
    '<p><strong>Total:</strong> ' + eur(o.total) + '</p><p><strong>Cliente:</strong> ' + o.usuario + ' (' + o.email + ')</p>' +
    '<p><strong>Envio a:</strong> ' + o.direccion + '</p><p><strong>Telefono:</strong> ' + o.telefono + '</p>';
}
if (!sesion()) { location.href = "login.html"; }
else {
  var loc = JSON.parse(localStorage.getItem("pedidos_locales") || "[]").filter(function (o) { return o.id === id; })[0];
  if (loc) pintar(loc);
  else fetch("data/pedidos/" + id + ".json").then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(pintar)
    .catch(function () { document.getElementById("d").textContent = "Pedido no encontrado."; });
}
</script>
</main>
<footer>PCForge · Maqueta estatica de practicas de auditoria web.</footer>
</body>
</html>
