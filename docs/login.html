<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · PCForge</title>
<link rel="stylesheet" href="style.css">
<script src="js/app.js"></script>
</head>
<body>
<div id="cab"></div>
<main>
<h1>Entrar</h1>
<form id="f" class="panel">
  <p class="err" id="err" style="display:none"></p>
  <label for="usuario">Usuario</label><input id="usuario" autocomplete="username" required>
  <label for="clave">Contrasena</label><input id="clave" type="password" autocomplete="current-password" required>
  <p><button type="submit">Entrar</button></p>
</form>
<script>
document.getElementById("f").onsubmit = function (e) {
  e.preventDefault();
  var u = document.getElementById("usuario").value, c = document.getElementById("clave").value;
  var ok = USUARIOS.filter(function (x) { return x.usuario === u && x.clave === c; })[0];
  if (!ok) { var m = document.getElementById("err"); m.style.display = "block"; m.textContent = "Usuario o contrasena incorrectos"; return; }
  localStorage.setItem("sesion", JSON.stringify({ usuario: ok.usuario, rol: ok.rol }));
  location.href = "index.html";
};
</script>
</main>
<footer>PCForge · Maqueta estatica de practicas de auditoria web.</footer>
</body>
</html>
