<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administracion · PCForge</title>
<link rel="stylesheet" href="style.css">
<script src="js/app.js"></script>
</head>
<body>
<div id="cab"></div>
<main>
<h1>Administracion</h1>
<div id="cont"><p>Acceso restringido.</p></div>
<script>
var s = sesion();
// VULN: el control de acceso se hace solo en el navegador
if (s && s.rol === "admin") {
  fetch("data/admin/usuarios.json").then(function (r) { return r.json(); }).then(function (us) {
    document.getElementById("cont").innerHTML = '<h2>Usuarios</h2><div class="tabla"><table><tr><th>ID</th><th>Usuario</th><th>Correo</th><th>Rol</th></tr>' +
      us.map(function (u) { return '<tr><td>' + u.id + '</td><td>' + u.usuario + '</td><td>' + u.email + '</td><td>' + u.rol + '</td></tr>'; }).join("") + '</table></div>';
  });
}
</script>
</main>
<footer>PCForge · Maqueta estatica de practicas de auditoria web.</footer>
</body>
</html>
